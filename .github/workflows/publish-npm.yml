name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/react-node-flow/package.json').version")
          test "v$PKG_VERSION" = "$GITHUB_REF_NAME"

      - run: pnpm exec vp run ready

      - name: Publish
        run: pnpm --filter @fedkit/react-node-flow publish --no-git-checks
